name: College foundation preview preflight

on:
  workflow_dispatch:
  push:
    branches:
      - benpham/college-database
    paths:
      - .github/workflows/college-foundation-preview.yml
      - docs/college-data/**
      - infra/college-foundation/supabase/**
      - package-lock.json
      - package.json
      - scripts/college-data/**
      - src/components/colleges/**
      - src/http/collegeRoutes.ts
      - src/lib/types/college.ts
      - src/pages/CollegeDetail.tsx
      - src/pages/CollegesGallery.tsx
      - src/services/collegeDiscovery/**
      - tests/college-data/**
      - tsconfig.college-data.json

permissions:
  contents: read

jobs:
  local-preflight:
    name: Verify college foundation locally
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0

      - name: Replay foundation on a fresh local database
        run: supabase --workdir infra/college-foundation start

      - name: Test foundation constraints and grants
        env:
          PGPASSWORD: postgres
        run: |
          psql \
            postgresql://postgres@127.0.0.1:55322/postgres \
            -X \
            -f tests/college-data/milestone-2-foundation.sql

      - name: Test production cutover migration replay
        env:
          PGPASSWORD: postgres
        run: |
          psql \
            postgresql://postgres@127.0.0.1:55322/postgres \
            -X \
            -f tests/college-data/cutover-migration-replay.sql

      - name: Typecheck the ingestion pipeline
        run: npm run typecheck:college-ingestion

      - name: Test parsers, promotion, and ingestion grants
        run: npm run test:college-ingestion

      - name: Test versioned college serving layer
        run: npm run test:college-serving

      - name: Typecheck and build the college experience
        run: |
          npm run typecheck
          npm run build

      - name: Stop local foundation database
        if: always()
        run: supabase --workdir infra/college-foundation stop --no-backup
