name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  typecheck-and-test:
    name: Typecheck + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install deps
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test

  integration:
    name: Integration tests (Postgres round-trip)
    needs: typecheck-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SUPABASE_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres
      SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_TEST_KEY }}
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install deps
        run: npm ci
      - name: Install supabase CLI
        run: |
          curl -sL https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz \
            | tar -xz -C /tmp
          sudo mv /tmp/supabase /usr/local/bin/
          supabase --version
      - name: Apply migrations to service-container Postgres
        run: |
          for f in supabase/migrations/*.sql; do
            echo "applying $f"
            PGPASSWORD=postgres psql \
              -h localhost -U postgres -d postgres \
              -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Integration tests
        run: npm run test:integration
