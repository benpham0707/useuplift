name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  typecheck-and-test:
    name: Typecheck + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install deps
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Descriptive-contract lint (L1/L3/L3.75 prompt purity)
        run: npx tsx tests/essay-intelligence/test-descriptive-contract-lint.ts
      - name: Gold-claim never-regress guard (calibration gold + corpus factual integrity)
        run: npx tsx tests/calibration/verifyGoldClaims.ts
      - name: Unit tests (tsx runner)
        run: npm test
      - name: Unit tests (vitest suites)
        run: npm run test:vitest

  integration:
    name: Integration tests
    needs: typecheck-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Secrets surface to the job env. When absent, each integration test
      # self-skips (exit 77) via its own gate; the job stays green.
      SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_TEST_KEY }}
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install deps
        run: npm ci
      - name: Integration tests
        run: npm run test:integration
